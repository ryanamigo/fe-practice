<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>music</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <!-- 背景 -->
    <div id="bg">
        <!-- 内框 -->
        <div id="blackBorder">
            <!-- 曲图 -->
            <img id="musicImage" class="musicImage" src="./resources/img/消费现状.jpg">
            <!-- 歌名 -->
            <p id="musicName">当代年轻人的消费现状</p>
            <p class="lyrics2">Cosmo Sheldrake</p>
            <!-- 进度条 -->
            <!-- <progress value="2.23" max="3.15" color="pink">70%</progress> -->
            <div style="margin-top: 20px;">
                <div class="timeBox">
                    <p id="timeLeft"></p>
                    <p id="timeRight"></p>
                </div>
                <div style="width: 100%;height: 8px; border-radius: 5px; background-color: white; margin-top: 2px;">   
                    <div id="musicTimeProgress" style="width: 0; height: 8px; background-color: pink; border-top-left-radius: 5px; border-bottom-left-radius: 5px;"></div>
                </div>
            </div>
            <!-- 按键 -->
             <div>
                <div class="middleButton">   
                    <img id="playButton" style="width: 60%;height: 100%;" src="./resources/Play_fill.svg" onclick="playOrPause()">   
                </div>
                <img id="leftButton" src="./resources/Stop_and_play_fill-1.svg" onclick="playPrev()">
                <img id="rightButton" src="./resources/Stop_and_play_fill.svg" onclick="playNext()">
             </div>
             <audio id="audio1" src="./resources/mp3/一块姜糖er - 当代年轻人的消费现状.mp3"></audio>
        </div>
    </div>
</body>
</html>
<script>
    const audio1 = document.getElementById('audio1')
    const playButton = document.getElementById('playButton')
    const musicTimeProgress = document.getElementById('musicTimeProgress')
    const timeLeft = document.getElementById('timeLeft')
    const timeRight = document.getElementById('timeRight')
    const musicImage = document.getElementById('musicImage')
    const musicName = document.getElementById('musicName')
    let ifPlayFlag = 0 //是否播放标志位 0表示暂停，1表示播放
    let currentIndex = 0 //歌曲数组下标的标志位
    //歌曲数组
    const musicArray=[
        {src: './resources/mp3/一块姜糖er - 当代年轻人的消费现状.mp3', name: '当代年轻人的消费现状', cover: './resources/img/消费现状.jpg'},
        {src: './resources/mp3/张卫健 - 一花两果.mp3', name: '一花两果', cover: './resources/img/一花两果.jpg'},
        {src: './resources/mp3/张卫健 - 信徒.mp3', name: '信徒', cover: './resources/img/信徒.jpg'},
        {src: './resources/mp3/张卫健 - 天外有天.mp3', name: '天外有天', cover: './resources/img/法术乌魔多.jpg'},
        {src: './resources/mp3/张卫健 - 把酒狂歌.mp3', name: '把酒狂歌', cover: './resources/img/法术乌魔多.jpg'},
        {src: './resources/mp3/张卫健 - 法术乌魔多.mp3', name: '法术乌魔多', cover: './resources/img/法术乌魔多.jpg'},
    ]
    timeLeft.innerHTML = 0
    timeRight.innerHTML = musicArray[0].time
    //播放or暂停
    function playOrPause(){
        if(ifPlayFlag == 0) {
            musicName.innerHTML = musicArray[currentIndex].name
            musicImage.src = musicArray[currentIndex].cover
            audio1.play()
            playButton.src = './resources/pause.svg'
            let time = 0
            const intervalId = setInterval(()=>{
                if(audio1.currentTime <= audio1.duration){
                    timeLeft.innerHTML = audio1.currentTime - audio1.currentTime%1
                    timeRight.innerHTML = audio1.duration - audio1.duration%1
                    musicTimeProgress.style.width = `${((audio1.currentTime + 0.0) / audio1.duration)*100}%`
                }
            },1000)
        }
        if(ifPlayFlag == 1){ 
            audio1.pause()
            playButton.src = './resources/Play_fill.svg'
            
        }
        ifPlayFlag = !ifPlayFlag
    }
    //上一首
    function playPrev(){
        if(currentIndex == 0) currentIndex = musicArray.length-1
        else currentIndex--
        musicName.innerHTML = musicArray[currentIndex].name
        musicImage.src = musicArray[currentIndex].cover
        audio1.src = musicArray[currentIndex].src
        audio1.play()
        playButton.src = './resources/pause.svg'
    }
    //下一首
    function playNext(){
        if(currentIndex == musicArray.length-1) currentIndex = 0
        else currentIndex++
        musicName.innerHTML = musicArray[currentIndex].name
        musicImage.src = musicArray[currentIndex].cover
        audio1.src = musicArray[currentIndex].src
        audio1.play()
        playButton.src = './resources/pause.svg'
    }
</script>
